[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Short links for future landing pages, e.g. join.nonslopfun.com/reading
[[redirects]]
  from = "/reading"
  to = "https://nonslopfun.com/rebuild-your-reading-habit"
  status = 302
